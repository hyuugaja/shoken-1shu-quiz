ap}.result.ok{background:#eefaf1;color:#176b35}.result.ng{background:#fff1f1;color:#9d1c1c}.actions{display:flex;gap:10px;margin-top:14px}.actions button{flex:1}.navgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}.navgrid button{min-height:34px;padding:3px;font-size:12px}.navgrid .done{background:#e7f5f3}.navgrid .cur{outline:3px solid #0f766e}.score{font-size:36px;font-weight:900;color:#0f766e;margin:8px}.muted{color:#667085;font-size:13px}.footer{text-align:center;color:#667085;font-size:11px;padding:8px 5px 25px}@media(max-width:560px){.row{grid-template-columns:1fr}.question{font-size:16px}.navgrid{grid-template-columns:repeat(8,1fr)}header h1{font-size:18px}}</style></head><body><header><h1>証券外務員一種｜過去問クイズ</h1><p>4回・180問｜第1問○×25問＋第2問4択20問</p></header><main><section id="setup" class="card"><h2 style="margin-top:0">試験回を選択</h2><div class="row"><div><label for="date">試験回</label><select id="date"></select></div><div><label for="section">問題区分</label><select id="section"><option value="all">第1問＋第2問</option><option value="1">第1問（○×・25問）</option><option value="2">第2問（4択・20問）</option></select></div><div><label for="count">出題数</label><select id="count"><option value="all">すべて</option><option value="10">10問</option><option value="20">20問</option><option value="45">45問</option></select></div><div><label for="order">出題順</label><select id="order"><option value="normal">順番どおり</option><option value="random">ランダム</option></select></div></div><button class="primary" id="start" style="margin-top:14px">クイズを開始</button></section><section id="quiz" class="hidden"><div class="card"><div class="top"><span id="meta" class="badge"></span><span id="qno" class="qno"></span></div><div class="progress"><div id="bar" class="bar"></div></div><div id="question" class="question"></div><div id="choices" class="choices"></div><div id="result" class="result hidden"></div><div class="actions"><button class="secondary" id="next" disabled>次の問題</button><button class="danger" id="quit">終了</button></div></div><div class="card"><div class="top"><strong>問題一覧</strong><span class="muted">タップで移動</span></div><div id="nav" class="navgrid" style="margin-top:10px"></div></div></section><section id="finish" class="hidden"><div class="card" style="text-align:center"><div class="muted">結果</div><div id="score" class="score"></div><div id="summary" class="muted"></div><div class="actions"><button class="primary" id="retry">同じ条件でもう一度</button><button class="secondary" id="home">設定に戻る</button></div></div></section><div class="footer">問題文・正答・解説は、提供された第一種証券外務員試験問題および解答をもとに収録しています。</div></main><script>const DATA=[{"date":"2026年07月02日","section":1,"question":"証券市場における流通市場は、資金を調達することを目的として株式や債券等 の有価証券が発行され、それらの有価証券が発行者から直接または仲介者を通じ て投資者に第１次取得される市場のことをいう。","options":[],"answer":"×","explanation":"× 証券市場における流通市場は、すでに発行された有価証券が第１次投資者から第２次、 第３次と転々と売買され、流通する市場のことをいう。（ｐ.６） ＊金融商品取引法＊＊＊","num":1},{"date":"2026年07月02日","section":1,"question":"内閣総理大臣は、外務員が欠格事由のいずれかに該当することとなったとき、 または登録の当時において欠格要件に該当していたことが判明したときは、登録 の取消しまたは５年以内の職務停止を命ずることができる。","options":[],"answer":"×","explanation":"× 内閣総理大臣は、外務員が欠格事由のいずれかに該当することとなったとき、または 登録の当時において欠格要件に該当していたことが判明したときは、登録の取消しま たは２年以内の職務停止を命ずることができる。（ｐ.32）","num":2},{"date":"2026年07月02日","section":1,"question":"登録金融機関またはその役職員が、金融商品取引契約につき、顧客に対して、 社会通念上のサービスと考えられるものを提供することは、金融商品取引法にお ける特別の利益の提供に含まれる。","options":[],"answer":"×","explanation":"× 社会通念上のサービスと考えられるものを提供することは、金融商品取引法における 特別の利益の提供には含まれない。（ｐ.45）","num":3},{"date":"2026年07月02日","section":1,"question":"有価証券の売買その他の取引等について、顧客に損失が生じたり、あらかじめ 定めた額の利益が生じないことになった場合に、これを補塡したり補足するため に財産上の利益を提供することを登録金融機関が当該顧客にあらかじめ約束する 行為は、損失補塡等の禁止に該当する。","options":[],"answer":"○","explanation":"〇 （ｐ.39-40）","num":4},{"date":"2026年07月02日","section":1,"question":"有価証券売買取引等につき、登録金融機関の代表者、代理人、使用人その他の 従業者が、登録金融機関の業務に関し、電子情報処理組織の異常により、顧客の 注文の執行を誤ることにより、顧客に損失を及ぼすことは、金融商品取引業等に 関する内閣府令（金商業等府令）における事故に該当する。","options":[],"answer":"○","explanation":"〇 （ｐ.40） ＊金融商品の勧誘・販売に関係する法律＊＊＊","num":5},{"date":"2026年07月02日","section":1,"question":"金融サービスの提供及び利用環境の整備等に関する法律（金融サービス提供 法）において、金融商品販売業者等が重要事項の説明義務に違反した場合、当該 金融商品販売業者等の故意または過失の存在がある場合に限り、顧客に生じた損 害の賠償責任を当該金融商品販売業者等が負うものとしている。","options":[],"answer":"×","explanation":"× 金融サービス提供法において、金融商品販売業者等が重要事項の説明義務に違反した 場合、当該金融商品販売業者等の故意または過失の有無を問わないものとし、無過 失責任としてこれによって顧客に生じた損害の賠償責任を当該金融商品販売業者等が 負うものとしている。（ｐ.118）","num":6},{"date":"2026年07月02日","section":1,"question":"個人情報の保護に関する法律（個人情報保護法）において、要配慮個人情報は、 本人の人種、信条、社会的身分、病歴、犯罪の経歴、犯罪により害を被った事実 その他本人に対する不当な差別、偏見その他の不利益が生じないようにその取扱 いに特に配慮を要するものとして政令で定める記述等が含まれる個人情報をいう。","options":[],"answer":"○","explanation":"〇 （ｐ.125-126） ＊協会定款・諸規則＊＊＊","num":7},{"date":"2026年07月02日","section":1,"question":"登録金融機関の従業員は、顧客から有価証券等の注文を受けたときは、自己が その相手方となって取引等を成立させることができる。","options":[],"answer":"×","explanation":"× 登録金融機関の従業員は、顧客から有価証券等の注文を受けたときは、自己がその相 手方となって取引等を成立させてはならない。（ｐ.186）","num":8},{"date":"2026年07月02日","section":1,"question":"登録金融機関は、顧客からの苦情の申出および顧客との間の紛争について、担 当部署を定める等社内管理体制を整備し、その適切な処理に努めなければならな い。","options":[],"answer":"○","explanation":"〇 （ｐ.158）","num":9},{"date":"2026年07月02日","section":1,"question":"登録金融機関は、従業員における上場会社等の特定有価証券等にかかる売買 等が、社内規則に基づき適切に行われているか否かについて、定期的に検査を行 わなければならない。","options":[],"answer":"○","explanation":"〇 （ｐ.191） ＊投資信託および投資法人に関する業務＊＊＊","num":10},{"date":"2026年07月02日","section":1,"question":"上場投資信託（ＥＴＦ）の売買注文は、指値注文および成行注文が可能であ る。","options":[],"answer":"○","explanation":"〇 （ｐ.229）","num":11},{"date":"2026年07月02日","section":1,"question":"外国投資信託は、海外において外国の法律に基づいて設定・運用されるもの であり、外国投資信託を日本で販売する場合、金融商品取引法や投資信託及び 投資法人に関する法律（投信法）は適用されず、投資対象先の国におけるルー ルに基づき販売が行われる。","options":[],"answer":"×","explanation":"× 外国投資信託は、海外において外国の法律に基づいて設定・運用されるものであり、 外国投資信託を日本で販売する場合、金融商品取引法や投資信託及び投資法人に関す る法律（投信法）が適用され、日本で設定された投資信託と同じルールに基づき販売 が行われる。（ｐ.229）","num":12},{"date":"2026年07月02日","section":1,"question":"不動産投資法人は、投資対象の不動産が地震や火災等の予測不可能な災害に よって、価格や分配金が低下するリスクが存在する。","options":[],"answer":"○","explanation":"〇 （ｐ.252） ＊セールス業務＊＊＊","num":13},{"date":"2026年07月02日","section":1,"question":"投資方針や投資目的、資産や収入などに照らして明らかに不適切な投資を投 資家が行 ":22},{"date":"2026年07月02日","section":1,"question":"国債先物取引では、１日の価格変動幅について制限がない。","options":[],"answer":"×","explanation":"× 国債先物取引では、１日の価格変動幅に一定の制限が設けられている。（ｐ.388） ＊デリバティブ取引と協会定款・諸規則＊＊＊","num":23},{"date":"2026年07月02日","section":1,"question":"金融商品取引法施行令において、特定投資家以外の顧客を相手方とする店頭 デリバティブ取引（店頭ＣＦＤ取引を含む）にかかる契約の締結の勧誘に対し ては、勧誘受諾意思の確認義務および再勧誘の禁止が適用されるが、不招請勧 誘の禁止の適用はない。","options":[],"answer":"×","explanation":"× 金融商品取引法施行令において、特定投資家以外の顧客を相手方とする店頭デリバ ティブ取引（店頭ＣＦＤ取引を含む）にかかる契約の締結の勧誘に対しては、不招請 勧誘の禁止、勧誘受諾意思の確認義務および再勧誘の禁止が適用される。（ｐ.425）","num":24},{"date":"2026年07月02日","section":1,"question":"登録金融機関は、有価証券関連店頭デリバティブ取引について、営業日ごと に値洗いを行い、実預託額が必要な証拠金額に不足する場合、その不足額を速 やかに預託させなければ、取引を継続させることはできない。","options":[],"answer":"○","explanation":"〇 （ｐ.427） 【第２問】 以下の各問について、選択肢の中から正しいものを１つ選び、解 答欄のその番号を塗りつぶしなさい。 ＊金融商品取引法＊＊＊","num":25},{"date":"2026年07月02日","section":2,"question":"登録金融機関業務に関する行為規制に関する記述として、正しいものは次のう ちどれか。正しい選択肢の番号を１つ選びなさい。 イ．登録金融機関は、金融商品取引契約が成立したときその他内閣府令で定めるとき は、遅滞なく、当該金融商品取引契約に関する事項その他の内閣府令で定める事 項にかかる情報を提供しなければならない。 ロ．登録金融機関またはその役職員は、当初、顧客の同意を得ずに取引等を行い、事 後的に顧客の同意を得る事後承諾売買が認められている。 ハ．金融商品取引法上の虚偽の表示の禁止は、勧誘行為がなくても適用され、特に必 要な表示が欠けている場合等の不作為についても適用される。","options":["イおよびロは正しく、ハは正しくない。","イおよびハは正しく、ロは正しくない。","ロおよびハは正しく、イは正しくない。","イ、ロ、ハすべて正しい。"],"answer":"2","explanation":"イ．〇 （ｐ.35） ロ．× 登録金融機関またはその役職員は、当初、顧客の同意を得ずに取引等を行い、事 後的に顧客の同意を得る事後承諾売買は禁止されている。（ｐ.48） ハ．〇 （ｐ.45）","num":1},{"date":"2026年07月02日","section":2,"question":"金融商品取引法における断定的判断の提供に関する記述として、正しいものは 次のうちどれか。正しい選択肢の番号を１つ選びなさい。 イ．登録金融機関またはその役職員が、勧誘に際して、価格が騰貴または下落する時 期を具体的に指示することは、断定的判断の提供には該当しない。 ロ．登録金融機関またはその役職員が、顧客に対して「その債券は絶対に下がるから 今のうちに売りなさい」というように有価証券の取引について断定的な表現をし て勧誘することは禁止されている。 ハ．断定的判断の提供による勧誘は、それが結果的に的中し、顧客の利益につながっ たとしても違法行為となる。","options":["イおよびロは正しく、ハは正しくない。","イおよびハは正しく、ロは正しくない。","ロおよびハは正しく、イは正しくない。","イ、ロ、ハすべて正しい。"],"answer":"3","explanation":"イ．× 価格が騰貴または下落する価格の時期を具体的に指示することは、断定的判断の 提供となる場合がある。（ｐ.44） ロ．〇 （ｐ.44） ハ．〇 （ｐ.44）","num":2},{"date":"2026年07月02日","section":2,"question":"相場操縦に関する記述として、正しいものは次のうちどれか。正しい選択肢の 番号を１つ選びなさい。 は正しくない。","ハは正しく、イおよびロは正しくない。","イ、ロ、ハすべて正しくない。"],"answer":"4","explanation":"イ．× 投資信託財産の管理は、受託会社の業務に該当する。（ｐ.211） ロ．× 投資信託財産の設定は、投資信託委託会社（委託会社）の業務に該当する。 （ｐ.210） ハ．× 投資信託契約の締結、投資信託約款の届出・変更は、投資信託委託会社（委託会 社）の業務に該当する。（ｐ.210）","num":12},{"date":"2026年07月02日","section":2,"question":"投資法人に関する記述として、正しいものは次のうちどれか。正しい選択肢の 番号を１つ選びなさい。 イ．投資法人はまず設立企画人が規約を作成し、投資法人設立届出書を内閣総理大臣 に届け出て、その効力が生じた後に募集投資口の募集を行い、一定の手続を経て 登記することによって設立される。 ロ．投資法人の成立時の出資総額は、設立の際に発行する投資口の払込金額の総額で あり、１億円以上と定められている。 ハ．投資法人は、投資法人にかかる業務について外部委託することができず、当該投 資法人の執行役員は、投資証券等の募集等にかかる事務を行う必要がある。","options":["イおよびロは正しく、ハは正しくない。","イおよびハは正しく、ロは正しくない。","ロおよびハは正しく、イは正しくない。","イ、ロ、ハすべて正しい。"],"answer":"1","explanation":"イ．〇 （ｐ.247） ロ．〇 （ｐ.248） ハ．× 投資法人は、投資法人にかかる業務は外部委託することになっており、投資法人 の執行役員は、投資証券等の募集等にかかる事務をしてはならない。（ｐ.249） ＊債券業務＊＊＊","num":13},{"date":"2026年07月02日","section":2,"question":"債券の売買に関する記述として、正しいものは次のうちどれか。正しい選択肢 の番号を１つ選びなさい。 イ．現先取引は、売買に際し同種、同量の債券等を、一定期間後に、一定価格で反対 売買することをあらかじめ取り決めて行う取引のことである。 ロ．公共債のディーリング業務の登録を受けていない金融機関がはね返り玉の買取り を行う場合、自金融機関および他金融機関で販売したものが買取りの対象となる。 ハ．保護預り制度における特定保管は、多数の顧客から預かった同一銘柄の債券を一 括・混同して債券番号等を特定せずに預かる方法であり、返還する際、同一銘 柄・同一金額の債券を返還すればよいとされている保管方法である。","options":["イは正しく、ロおよびハは正しくない。","ロは正しく、イおよびハは正しくない。","ハは正しく、イおよびロは正しくない。","イ、ロ、ハすべて正しくない。"],"answer":"1","explanation":"イ．〇 （ｐ.307） ロ．× 公共債のディーリング業務の登録を受けていない金融機関がはね返り玉の買取り を行う場合、自金融機関で販売したものに限られる。（ｐ.305） ハ．× 保護預り制度における特定保管は、債券の券種・数量のほかに債券番号等を特定 して顧客から債券を預かる方法であり、返還する際、預かった債券そのものを返 還しなければならない保管方法である。（ｐ.305-306）","num":14},{"date":"2026年07月02日","section":2,"question":"債券の投資計算に関する記述として、正しいものは次のうちどれか。正しい 選択肢の番号を１つ選びなさい。 イ．債券売買の際は、直前の利払日の翌日から受渡日までの経過日数に応じて、売手 から買手に経過利子を支払わなければならない。 ロ．債券のクーポン収入のことを、キャピタル・ゲインという。 ハ．最終利回りは、債券を購入した後、最終償還日まで所有することを前提とした場 合の利回りであり、購入価格に対して、１年当りに換算して、どれだけの利子収 入および償還差損益が得られたかを示すものである。","options":["イは正しく、ロおよびハは正しくない。","ロは正しく、イおよびハは正しくない。","ハは正しく、イおよびロは正しくない。","イ、ロ、ハすべて正しくない。"],"answer":"3","explanation":"イ．× 債券売買の際は、直前の利払日の翌日から受渡日までの経過日数に応じて、買手 から売手に経過利子が支払われる。（ｐ.315） ロ．× 債券のクーポン収入のことを、インカム・ゲインという。（ｐ.312） ハ．〇 （ｐ.313）","num":15}, ハは正しくない。","イおよびハは正しく、ロは正しくない。","ロおよびハは正しく、イは正しくない。","イ、ロ、ハすべて正しい。"],"answer":"2","explanation":"イ．〇 （ｐ.81） ロ．× 相場操縦の成立には、それにより投資者の利益が害されること、利益の獲得を目 的にしていることは必要ではなく、市場の公正な価格形成を人為的に歪曲する意 思のみで相場操縦とされる。（ｐ.81） ハ．〇 （ｐ.81）","num":3},{"date":"2026年01月27日","section":2,"question":"内部者取引規制に関する記述として、正しいものは次のうちどれか。正しい選 択肢の番号を１つ選びなさい。 イ．上場会社等の業務執行を決定する機関が、自己の株式の取得（内閣府令で定める 軽微基準に該当しないもの）を行う決定をしたことは、上場会社等の業務等に関 する重要事実には含まれない。 ロ．内部者取引規制の対象となる会社関係者の範囲には、以前、会社関係者であり、 当該会社関係者でなくなってから１年以内の者も含まれる。 ハ．上場会社等の会社関係者であって重要事実を知った者は、他人に対し、当該重要 事実の公表前に取引をさせることにより利益を得させ、または損失を回避させる 目的をもって、当該重要事実を伝達し、または取引を勧めてはならない。","options":["イおよびロは正しく、ハは正しくない。","イおよびハは正しく、ロは正しくない。","ロおよびハは正しく、イは正しくない。","イ、ロ、ハすべて正しい。"],"answer":"3","explanation":"イ．× 上場会社等の業務執行を決定する機関が、自己の株式の取得（内閣府令で定める 軽微基準に該当しないもの）を行う決定をしたことは、上場会社等の業務等に関 する重要事実に含まれる。（ｐ.85-86） ロ．〇 （ｐ.85） ハ．〇 （ｐ.87） ＊金融商品の勧誘・販売に関係する法律＊＊＊","num":4},{"date":"2026年01月27日","section":2,"question":"消費者契約法に関する記述として、正しいものは次のうちどれか。正しい選択 肢の番号を１つ選びなさい。 イ．消費者契約法は、民法の意思表示の瑕疵に関する条項の特則と位置づけられてお り、消費者契約法における別段の定めがある場合を除き、民法・商法に優先して 適用される。 ロ．消費者契約において、消費者の利益を一方的に害する条項は無効となるが、消費 者が支払う損害賠償の額を予定する条項は無効とはならない。 ハ．事業者が勧誘に際し、加齢や心身の故障による消費者の判断力の低下を不当に利 用したことによって契約を締結した場合、困惑惹起行為として、当該消費者は、 契約を取り消すことができる。","options":["イおよびロは正しく、ハは正しくない。","イおよびハは正しく、ロは正しくない。","ロおよびハは正しく、イは正しくない。","イ、ロ、ハすべて正しい。"],"answer":"2","explanation":"イ．〇 （ｐ.121） ロ．× 消費者の利益を一方的に害する条項、消費者が支払う損害賠償の額を予定する条 項は、どちらも無効となる。（ｐ.124） ハ．〇 （ｐ.123）","num":5},{"date":"2026年01月27日","section":2,"question":"個人情報の保護に関する法律（個人情報保護法）に関する記述として、正しい ものは次のうちどれか。正しい選択肢の番号を１つ選びなさい。 イ．匿名加工情報は、個人情報を個人情報の区分に応じて定められた措置を講じて特 定の個人を識別することができないように加工して得られる個人に関する情報で あって、当該個人情報を復元して特定の個人を再識別することができないように したものをいう。 ロ．個人情報取扱事業者は、法令等に基づく場合や、人の生命、身体または財産の保 護のために必要がある場合、本人の同意がなくても個人データを第三者に提供す ることができる。 ハ．個人情報取扱事業者は、その取り扱う個人データの漏えい、滅失、毀損その他の 個人データの安全の確保にかかる事態であって個人の権利利益を害するおそれが 大きいものとして個人情報保護委員会規則で定めるものが生じたときは、当該事 態が生じた旨を個人情報保護委員会に報告しなければならない。","options":["イおよびロは正しく、ハは正しくない。","イおよびハは正しく、ロは正しくない。","ロおよびハは正しく、イは正しくない。","イ、ロ、ハすべて正しい。"],"answer":"4","explanation":"イ． ion":1,"question":"投資家が証券投資を行う場合、その投資を行うかどうかの最終的な決定は、 外務員の判断と責任に基づいて行わなければならない。","options":[],"answer":"×","explanation":"× 投資家が証券投資を行う場合、その投資を行うかどうかの最終的な決定は、投資家自 身の判断と責任に基づいて行われる必要がある。（ｐ.262）","num":14},{"date":"2025年10月14日","section":1,"question":"金融庁から公表されている「顧客本位の業務運営に関する原則」において、 金融事業者は、取引における顧客との利益相反の可能性について正確に把握し、 利益相反の可能性がある場合には、当該利益相反を適切に管理すべきであり、 そのための具体的な対応方針をあらかじめ策定すべきであるとしている。","options":[],"answer":"○","explanation":"○ （ｐ.269） ＊債券業務＊＊＊","num":15},{"date":"2025年10月14日","section":1,"question":"店頭市場における売買の対象となる債券は、取引所に上場されている銘柄に 限定されている。","options":[],"answer":"×","explanation":"× 店頭市場は、取引所の上場債・非上場債、あるいは公募債・縁故債などを問わず、 発行されているすべての債券が売買の対象となる。（ｐ.292）","num":16},{"date":"2025年10月14日","section":1,"question":"保護預り制度における混合保管は、債券の券種・数量のほかに債券番号等を 特定して顧客から債券を預かる方法であり、返還する際には、預かった債券そ のものを返還しなければならない。","options":[],"answer":"×","explanation":"× 保護預り制度における混合保管は、多数の顧客から預かった同一銘柄の債券を一括・ 混同して債券番号等を特定せずに預かる方法であり、返還する際には、同一銘柄・同 一金額の債券を返還すればよい。（ｐ.303-304） ＊ＣＰ等短期有価証券業務＊＊＊","num":17},{"date":"2025年10月14日","section":1,"question":"登録金融機関の短期社債の売買等の業務全般を担当する部門は、短期社債等 の発行および売買に関連する業務と融資業務等との間での機微情報の一体化を 図らなければならない。","options":[],"answer":"×","explanation":"× 登録金融機関の短期社債の売買等の業務全般を担当する部門は、短期社債等の発行お よび売買に関連する業務と融資業務等との間での機微情報の流出入の遮断等に十全を 期することとなっている。（ｐ.321） ＊その他の金融商品取引業務＊＊＊","num":18},{"date":"2025年10月14日","section":1,"question":"登録金融機関は、特定目的会社（ＳＰＣ）が発行する証券の引受けおよび募 集の取扱い等を行うことができる。","options":[],"answer":"○","explanation":"〇 （ｐ.326） ＊デリバティブ取引の概説＊＊＊","num":19},{"date":"2025年10月14日","section":1,"question":"コール・オプションの場合、行使価格よりも原資産価格が下回っている状態 を、イン・ザ・マネーという。","options":[],"answer":"×","explanation":"× コール・オプションの場合、行使価格よりも原資産価格が下回っている状態を、ア ウト・オブ・ザ・マネーという。（ｐ.348-349）","num":20},{"date":"2025年10月14日","section":1,"question":"店頭デリバティブ取引は、売手と買手の二者間における相対取引であり、取 引相手であるカウンターパーティがデフォルトに陥った場合、損失を被るリスク が存在する。","options":[],"answer":"○","explanation":"〇 （ｐ.372） ＊デリバティブ取引の商品＊＊＊","num":21},{"date":"2025年10月14日","section":1,"question":"国債先物取引における決済の方法には、取引最終日前の反対売買による差金 決済と、現渡し・現引きによる受渡決済（期間満了での現物決済）の２通りがあ る。","options":[],"answer":"○","explanation":"〇 （ｐ.384）","num":22},{"date":"2025年10月14日","section":1,"question":"国債先物取引では、1 日の価格変動幅に一定の制限が設けられている。","options":[],"answer":"○","explanation":"〇 （ｐ.386） ＊デリバティブ取引と協会定款・諸規則＊＊＊","num":23},{"date":"2025年10月14日","section":1,"question":"金融商品取引法施行令において、個人を相手方とする店頭デリバティブ取引 （店頭ＣＦＤ取引を含む）にかかる契約の締結の勧誘に対しては、勧誘受諾意 思の確認義務が適用されるが、不招請勧誘の禁止の適用はない。","options":[],"answer":"×","explanation":"× 金融商品取引法施行令において、個人を相手方とする店頭デリバティブ取引（店頭Ｃ ＦＤ取引を含む）にかかる契約の締結の勧誘に対しては、不招請勧誘の禁止、勧誘受 諾意思の確認義務および再勧誘の禁止が適用される。（ｐ.423）","num":24},{"date":"2025年10月14日","section":1,"question":"登録金融機関は、店頭ＣＦＤ取引を含む有価証券関連店頭デリバティブ取引 について、営業日ごとに値洗いを行い、実預託額が必要な証拠金額に不足する 場合、その不足額を速やかに預託させなければ、取引を継続させてはならない。","options":[],"answer":"○","explanation":"〇 （ｐ.425） 【第２問】 以下の各問について、選択肢の中から正しいものを１つ選び、解 答欄のその番号を塗りつぶしなさい。 ＊金融商品取引法＊＊＊","num":25},{"date":"2025年10月14日","section":2,"question":"登録金融機関業務における投資勧誘・受託に関する記述として、正しいものは 次のうちどれか。正しい選択肢の番号を１つ選びなさい。 イ．登録金融機関またはその役職員は、虚偽の表示の禁止について、勧誘行為がなく ても適用されるが、特に必要な表示が欠けている場合等の不作為は虚偽の表示の 禁止は適用されない。 ロ．登録金融機関またはその役職員は、主観的な目的の有無を問わず、特定の銘柄の 有価証券等について、実勢を反映しない作為的相場が形成されることを知りなが ら、一連の売買取引の受託等を行うことは禁止されている。 ハ．登録金融機関またはその役職員は、当初、顧客の同意を得ずに取引等を行い、事 後的に顧客の同意を得る事後承諾売買が認められている。","options":["イは正しく、ロおよびハは正しくない。","ロは正しく、イおよびハは正しくない。","ハは正しく、イおよびロは正しくない。","イ、ロ、ハすべて正しくない。"],"answer":"2","explanation":"イ．× 登録金融機関またはその役職員は、虚偽の表示の禁止について、勧誘行為がなく ても適用され、特に必要な表示が欠けている場合等の不作為も含まれる。 （ｐ.44） ロ．〇 （ｐ.48） ハ．× 登録金融機関またはその役職員は、当初、顧客の同意を得ずに取引等を行い、事 後的に顧客の同意を得る事後承諾売買は禁止されている。（ｐ.48）","num":1},{"date":"2025年10月14日","section":2,"question":"損失補塡等の禁止に関する記述として、正しいものは次のうちどれか。正しい 選択肢の番号を１つ選びなさい。 イ．損失補塡等の禁止には、有価証券の売買その他の取引等について顧客が登録金融 機関に対して損失補塡を要求して財産上の利益の提供を受けることが含まれる。 ロ．有価証券の売買その他の取引等について顧客に生じた損失補塡が、金融商品取引 業等に関する内閣府令に定める事故に起因するものであることについて、登録金 融機関が、あらかじめ内閣総理大臣から確認を受けている場合、損失補塡等の禁 止の対象外となる。 ハ．有価証券の売買その他の取引等について、顧客に損失が生じたり、あらかじめ定 めた額の利益が生じないこととなった場合、これを補塡するために、財産上の利 益を提供することを登録金融機関が当該顧客にあらかじめ申し込み、約束する行 為は損失補塡等の禁止に該当しない。","options":["イおよびロは正しく、ハは正しくない。","イおよびハは正しく、ロは正しくない。","ロおよびハは正しく、イは正しくない。","イ、ロ、ハすべて正しい。"],"answer":"1","explanation":"イ．〇 （ｐ.39） ロ．〇 （ｐ.39-40） ハ．× 有価証券の売買その他の取引等について、顧客に損失が生じたり、あらかじめ定 めた額の利益が生じないこととなった場合、これを補塡するために、財産上の利 益を提供することを登録金融機関が当該顧客にあらかじめ申し込み、約束する行 為は損失補塡等の禁止に該当する。（ｐ.39）","num":2},{"date":"2025年10月14日","section":2,"question":"相場操縦に関する記述として、正しいものは次のうちどれか。正しい選択肢の 番号を１つ選びなさい。 イ．架空の注文を出して売買が成立しそうになると取り消す「見せ玉」は、実際に売 買を行うわけではないので相場操縦には該当しない。 ロ．有価証券売買等を行うにあたって、重要な事項について虚偽であり、または誤解 を生じさせるべき表示を故意に行うことによって取引を誘引することは、相場操 縦として禁止されている。 ハ．相場操縦は、それにより投資者の利益が害されること、利益の獲得を目的にして いることは必要ではなく、市場の公正な価格形成を人為的に歪曲する意思のみで 成立する。","options":["イおよびロは正しく、ハは正しくない。","イおよびハは正しく、ロは正しくない。","ロおよびハは正しく、イは正しくない。","イ、ロ、ハすべて正しい。"],"answer":"3","explanation":"イ．× 架空の注文を出して売買が成立しそうになると取り消す「見せ玉」は、相場操縦 に該当し禁止されている。（ｐ.81） ロ．〇 （ｐ.81-82） ハ．〇 （ｐ.80-81）","num":3},{"date":"2025年10月14日","section":2,"question":"内部者取引規制に関する記述として、正しいものは次のうちどれか。正しい選 択肢の番号を１つ選びなさい。 イ．内部者取引規制の対象となる会社関係者は、上場会社等と契約を締結している者 は含まれるが、当該上場会社等と契約の締結の交渉をしている者は含まれない。 ロ．上場会社等の業務執行を決定する機関が、募集株式・新株予約権の募集（有価証 券の取引等の規制に関する内閣府令で定める軽微基準に該当しないもの）を行う 決定をしたことは、上場会社等の業務等に関する重要事実に含まれる。 ハ．内部者取引規制の対象となる会社関係者の範囲は、以前会社関係者であり、会社 関係者でなくなってから２年経過した者が含まれる。","options":["イは正しく、ロおよびハは正しくない。","ロは正しく、イおよびハは正しくない。","ハは正しく、イおよびロは正しくない。","イ、ロ、ハすべて正しくない。"],"answer":"2","explanation":"イ．× 内部者取引規制の対象となる会社関係者には、上場会社等と契約の締結の交渉を している者も含まれる。（ｐ.83-84） ロ．〇 （ｐ.84-85） ハ．× 以前会社関係者であり、会社関係者でなくなって1 年以内の者が含まれる。 （ｐ.84） ＊金融商品の勧誘・販売に関係する法律＊＊＊","num":4},{"date":"2025年10月14日","section":2,"question":"消費者契約法に関する記述として、正しいものは次のうちどれか。正しい選択 肢の番号を１つ選びなさい。 イ．事業者の債務不履行により生じた消費者の解除権を放棄させる条項は無効となる が、消費者が支払う損害賠償の額を予定する条項は無効とならない。 ロ．消費者は、事業者の重要事項の不実告知により、自由な意思決定を妨げられた結 果結んだ契約を取り消すことができるが、事業者が虚偽の内容であると認識して いたことや消費者を欺こうとする意図があることが契約を取り消す際の要件とさ れている。 ハ．事業者が消費者契約の締結について勧誘をしている場所から消費者が退去する旨 の意思を示したにもかかわらず、その場所から当該消費者を退去させないことに よって当該消費者が困惑し契約を締結した場合、困惑惹起行為として、当該消費 者は、契約を取り消すことができる。","options":["イは正しく、ロおよびハは正しくない。","ロは正しく、イおよびハは正しくない。","ハは正しく、イおよびロは正しくない。","イ、ロ、ハすべて正しくない。"],"answer":"3","explanation":"イ．× 事業者の債務不履行により生じた消費者の解除権を放棄させる条項、消費者が支 払う損害賠償の額を予定する条項はどちらも無効となる。（ｐ.124） ロ．× 消費者は、事業者の重要事項の不実告知により、自由な意思決定を妨げられた結 果結んだ契約を取り消すことができるが、事業者が虚偽の内容であると認識して いたことや消費者を欺こうとする意図は取消しの要件とされていない。 （ｐ.121） ハ．〇 （ｐ.122）","num":5},{"date":"2025年10月14日","section":2,"question":"個人情報の保護に関する法律（個人情報保護法）に関する記述として、正しい ものは次のうちどれか。正しい選択肢の番号を１つ選びなさい。 イ．個人情報取扱事業者は、法令等に基づく場合や、人の生命、身体または財産の保 護のために必要がある場合、本人の同意がなくても個人データを第三者に提供す ることができる。 ロ．個人情報保護法は、個人情報を公開・非公開で区別しており、非公開の情報のみ を個人情報としている。 ハ．個人情報取扱事業者は、その取り扱う個人データの漏えい、滅失、毀損その他の 個人データの安全の確保にかかる事態であって個人の権利利益を害するおそれが 大きいものとして個人情報保護委員会規則で定めるものが生じたときは、当該事 態が生じた旨を個人情報保護委員会に報告しなければならない。","options":["イおよびロは正しく、ハは正しくない。","イおよびハは正しく、ロは正しくない。","ロおよびハは正しく、イは正しくない。","イ、ロ、ハすべて正しい。"],"answer":"2","explanation":"イ．〇 （ｐ.127） ロ．× 個人情報保護法は、個人情報を公開・非公開として区別しておらず、非公開情報 のみを保護するものではなく、公開情報であっても個人情報の定義に該当する限 り、個人情報となる。（ｐ.131） ハ．〇 （ｐ.130） ＊協会定款・諸規則＊＊＊","num":6},{"date":"2025年10月14日","section":2,"question":"投資勧誘に関する記述として、正しいものは次のうちどれか。正しい選択肢の 番号を１つ選びなさい。 イ．登録金融機関は、登録金融機関業務にかかる取引について、顧客に対して、委託 証拠金の新規または追加の差入れのための信用の供与を自動的に行うことができ る。 ロ．登録金融機関は、顧客から保管の委託を受けているまたは振替口座簿への記載も しくは記録により管理している投資信託等について、顧客に当該投資信託等にか かる損益（トータルリターン）を通知しなければならない。 ハ．登録金融機関は、新規顧客や大口取引顧客等から注文を受けるときは、あらかじ め当該顧客から、買付代金や売付有価証券の全部または一部の預託を受ける等、 取引の安全性の確保に努めなければならない。","options":["イおよびロは正しく、ハは正しくない。","イおよびハは正しく、ロは正しくない。","ロおよびハは正しく、イは正しくない。","イ、ロ、ハすべて正しい。"],"answer":"3","explanation":"イ．× 登録金融機関は、登録金融機関業務にかかる取引について、顧客に対して、委託 証拠金の新規または追加の差入れのための信用の供与を自動的に行ってはならな い。（ｐ.156） ロ．〇 （ｐ.157） ハ．〇 （ｐ.155）","num":7},{"date":"2025年10月14日","section":2,"question":"登録金融機関の従業員の行為規制に関する記述として、正しいものは次のうち どれか。正しい選択肢の番号を１つ選びなさい。 イ．有価証券の売買その他の取引等に関して、顧客と金銭または有価証券の貸借を行 うことは禁止されているが、この禁止行為には顧客の債務の立替えは含まれてい ない。 ロ．顧客に対して、融資、保証等に関する特別の便宜を提供することを約束して、登 録金融機関業務にかかる取引または当該取引の勧誘を行うことができる。 ハ．有価証券の売買その他の取引等について、顧客と損益を共にすることを約束して 勧誘しまたは実行することは禁止されている。","options":["イは正しく、ロおよびハは正しくない。","ロは正しく、イおよびハは正しくない。","ハは正しく、イおよびロは正しくない。","イ、ロ、ハすべて正しくない。"],"answer":"3","explanation":"イ．× 顧客との金銭または有価証券の貸借の禁止には、顧客の債務の立替えも含まれて いる。（ｐ.186） ロ．× 顧客に対して、融資、保証等に関する特別の便宜を提供することを約束して、登 録金融機関業務にかかる取引または当該取引の勧誘を行ってはならない。 （ｐ.185） ハ．〇 （ｐ.186）","num":8},{"date":"2025年10月14日","section":2,"question":"照合通知書に関する記述として、正しいものは次のうちどれか。正しい選択肢 の番号を１つ選びなさい。 イ．顧客に報告を行う時点で、預かっている金銭や有価証券の残高のない場合でも、 直前に行った報告以後1 年に満たない期間においてその残高のあった顧客に対し て、登録金融機関は、照合通知書により現在は残高がない旨を報告しなければな らない。 ロ．登録金融機関は、顧客から照合通知書に記載された金銭または有価証券の残高に ついて照会があった場合、当該顧客を担当する営業部門が遅滞なく回答しなけれ ばならない。 ハ．顧客が特定投資家の場合であって、当該顧客からの金銭または有価証券等の直近 の残高に関する照会に対して速やかに回答できる体制が整備されている場合で あっても、登録金融機関は、当該顧客に対して必ず照合通知書による報告をしな ければならない。","options":["イは正しく、ロおよびハは正しくない。","ロは正しく、イおよびハは正しくない。","ハは正しく、イおよびロは正しくない。","イ、ロ、ハすべて正しくない。"],"answer":"1","explanation":"イ．〇 （ｐ.174） ロ．× 顧客から照合通知書に記載された金銭または有価証券の残高について照会があっ た場合、検査、監査または管理の担当部門が遅滞なく回答しなければならない。 （ｐ.174） ハ．× 顧客が特定投資家の場合であって、顧客からの金銭または有価証券等の直近の残 高に関する照会に対して速やかに回答できる体制が整備されている場合には、照 合通知書による報告を省略することができる。（ｐ.174）","num":9},{"date":"2025年10月14日","section":2,"question":"公社債に関する記述として、正しいものは次のうちどれか。正しい選択肢の 番号を１つ選びなさい。 イ．登録金融機関は、顧客と公社債の店頭売買をする際、合理的な方法で算出された 時価（社内時価）を基準に、適正な価格で公正に行わなければならない。 ロ．登録金融機関は、公社債の店頭取引を行った際、約定時刻等を記載した注文にか かる伝票等を速やかに作成し、整理、保存する等適切な管理を行わなければなら ない。 ハ．小口投資家は、公社債の額面1,000 万円未満の取引を行う顧客のことであり、当 該顧客に金融商品取引法に規定される適格機関投資家および一定の事業会社等は 含まれない。","options":["イおよびロは正しく、ハは正しくない。","イおよびハは正しく、ロは正しくない。","ロおよびハは正しく、イは正しくない。","イ、ロ、ハすべて正しい。"],"answer":"4","explanation":"イ．〇 （ｐ.176-177） ロ．〇 （ｐ.177） ハ．〇 （ｐ.177） ＊投資信託および投資法人に関する業務＊＊＊","num":10},{"date":"2025年10月14日","section":2,"question":"証券投資信託の運用手法に関する記述として、正しいものは次のうちどれか。 正しい選択肢の番号を１つ選びなさい。 イ．アクティブ運用は、東証株価指数や日経平均株価などのインデックスをベンチ マークとし、ベンチマークにできるだけ近い運用成果を目指す運用手法である。 ロ．バリュー株運用は、企業の成長性を重視する運用手法であり、グロース株運用は、 株式の価値と株価水準を比較し、割安と判断される銘柄を中心にポートフォリオ を組成する運用手法である。 ハ．ボトムアップ・アプローチは、個別企業に対する調査・分析結果の積み重ねで ポートフォリオを組成し、ベンチマークを上回る収益を目指していく手法である。","options":["イは正しく、ロおよびハは正しくない。","ロは正しく、イおよびハは正しくない。","ハは正しく、イおよびロは正しくない。","イ、ロ、ハすべて正しくない。"],"answer":"3","explanation":"イ．× アクティブ運用は、経済、金利、企業の調査・分析結果等を踏まえ、ベンチマー クとは異なるリスクをとりにいき、ベンチマークを上回る運用成果を目指す運用 手法である。（ｐ.214） ロ．× グロース株運用は、企業の成長性を重視する運用手法であり、バリュー株運用は、 株式の価値と株価水準を比較し、割安と判断される銘柄を中心にポートフォリオ を組成する運用手法である。（ｐ.214） ハ．〇 （ｐ.214）","num":11},{"date":"2025年10月14日","section":2,"question 定の条件で債券を受渡しすることをあらか じめ約束する売買取引で、原則として、約定日から１カ月以上先に受渡しする取 引である。（ｐ.307） ハ．〇 （ｐ.309-310）","num":15},{"date":"2025年10月14日","section":2,"question":"利率年1.5％、償還期限10 年、発行価格100.20 円の利付国債を購入し、２年 後に100.80 円で売却した場合の所有期間利回りとして、正しい選択肢の番号 を１つ選びなさい（手数料および税金等は考慮しないものとし、答は、小数点 第４位以下を切捨て）。","options":["1.497％","1.593％","1.696％","1.796％"],"answer":"4","explanation":"答は、小数点第４位以下を切り捨てるため1.796％となる。（ｐ.311） （売却価格 100.80(円) － 購入価格 100.20(円)） 所有年数 ２(年) 利率1.5(%)＋ 所有期間利回り(%)＝ ×100≒1.7964(%) 購入価格 100.20(円) ＊デリバティブ取引の概説＊＊＊","num":16},{"date":"2025年10月14日","section":2,"question":"オプション取引に関する記述として、正しいものは次のうちどれか。正しい選 択肢の番号を１つ選びなさい。 イ．アメリカン・タイプは、満期日以前にいつでも権利行使可能なオプションである。 ロ．ストラドルの売り（ショート・ストラドル）は損失が無限定で、行使価格で最大 利益となる。 ハ．コール・オプションおよびプット・オプションはともに、ボラティリティが上昇 するほど、プレミアムは下落する。","options":["イおよびロは正しく、ハは正しくない。","イおよびハは正しく、ロは正しくない。","ロおよびハは正しく、イは正しくない。","イ、ロ、ハすべて正しい。"],"answer":"1","explanation":"イ．〇 （ｐ.343） ロ．〇 （ｐ.357-358） ハ．× コール・オプションおよびプット・オプションはともに、ボラティリティが上昇 するほど、プレミアムは上昇する。（ｐ.352）","num":17},{"date":"2025年10月14日","section":2,"question":"次の表は、行使価格104 円、プレミアム２円のコール・オプションの買方の満 期時における原資産価格と損益を表している。表中の（ ）にあてはまる数字の 組合せとして正しい選択肢の番号を１つ選びなさい。 原資産価格 103 104 105 106 107 損 益 （イ） （ロ） （ハ） （ニ） （ホ）","options":["（イ）－１  （ロ）±０  （ハ）＋１  （ニ）＋２  （ホ）＋３","（イ）－２  （ロ）－１  （ハ）±０  （ニ）＋１  （ホ）＋２","（イ）－２  （ロ）－２  （ハ）－１  （ニ）±０  （ホ）＋１","（イ）－３  （ロ）－２  （ハ）－１  （ニ）±０  （ホ）＋１"],"answer":"3","explanation":"（ｐ.345） ＊デリバティブ取引の商品＊＊＊","num":18},{"date":"2025年10月14日","section":2,"question":"ある顧客（居住者）が、長期国債先物を139.20 円で10 単位買建てし、その 後、138.60 円ですべて転売した場合における取引の損益として、正しい選択肢 の番号を1 つ選びなさい。なお、委託手数料は、買建て時および転売時にそれぞ れ50,000 円を顧客から徴収するものとする。また、委託手数料は、別に消費税 （10％）が加算されるものとし、その他の税金について考慮しないものとする。","options":["5,890,000 円の利益","5,890,000 円の損失","6,110,000 円の利益","6,110,000 円の損失"],"answer":"4","explanation":"損 益：（138.60 円－139.20 円）×1 億円/100 円×10 単位＝－6,000,000 円 コスト：（50,000 円×1.1）＋（50,000 円×1.1）＝110,000 円 取引の損益：－6,000,000 円－110,000 円＝－6,110,000 円 答は、6,110,000 円の損失となる。（ｐ.398-400）","num":19},{"date":"2025年10月14日","section":2,"question":"天候デリバティブ・災害デリバティブに関する記述として、正しいものは次の うちどれか。正しい選択肢の番号を１つ選びなさい。 イ．地震オプションは、実損塡補を目的としていないため、地震と実損の因果関係や 損害金額に関する調査が不要である。 ロ．ＣＡＴスワップは、国内損害保険会社同士が、国内で引き受けた自然災害保険の 再保険として、当該自然災害保険にかかるリスクを交換する取引である。 ハ．天候デリバティブは、実損塡補を目的としており、実際に損害が発生した相当額 についてのみ決済金が支払われる。","options":["イは正しく、ロおよびハは正しくない。","ロは正しく、イおよびハは正しくない。","ハは正しく、イおよびロは正しくない。","イ、ロ、ハすべて正しくない。"],"answer":"1","explanation":"イ．〇 （ｐ.414） ロ．× ＣＡＴスワップは、国内損害保険会社と海外損害保険会社が、各々の国内で引き 受けた自然災害保険の再保険として、当該自然災害保険にかかるリスクを交換す る取引である。（ｐ.413） ハ．× 天候デリバティブは、実損塡補を目的としないため、一定の条件を満たせば、実 際に損害が発生しなくても決済金が支払われる。（ｐ.412）","num":20}];
const $=id=>document.getElementById(id);
let quiz=[],idx=0,score=0,answered=false,lastConfig=null;
function dates(){return [...new Set(DATA.map(x=>x.date))].sort().reverse()}
function fillDates(){const el=$("date"); const ds=dates(); el.innerHTML=ds.map(d=>`<option value="${d}">${d}</option>`).join(""); if(ds.length) el.value=ds[0];}
function getCount(n,total){if(n==="all")return total;return Math.min(Number(n),total)}
function startQuiz(){
 const date=$("date").value, sec=$("section").value, count=$("count").value, order=$("order").value;
 let arr=DATA.filter(x=>x.date===date && (sec==="all" || String(x.section)===sec));
 if(!arr.length){alert("問題データが見つかりません。試験回を選び直してください。");return;}
 if(order==="random") arr=[...arr].sort(()=>Math.random()-.5); else arr=[...arr].sort((a,b)=>a.section-b.section||a.num-b.num);
 arr=arr.slice(0,getCount(count,arr.length)); quiz=arr; idx=0; score=0; lastConfig={date,sec,count,order}; $("setup").classList.add("hidden");$("finish").classList.add("hidden");$("quiz").classList.remove("hidden"); render(); window.scrollTo({top:0,behavior:"smooth"});
}
function render(){
 const q=quiz[idx]; answered=false;
 $("meta").textContent=`${q.date} / 第${q.section}問`;
 $("qno").textContent=`${idx+1} / ${quiz.length}`;
 $("bar").style.width=((idx+1)/quiz.length*100)+"%";
 $("question").textContent=q.question;
 const choices=$("choices"); choices.innerHTML="";
 const opts=q.section===1?["○","×"]:q.options;
 opts.forEach((op,i)=>{const b=document.createElement("button");b.className="choice";b.textContent=(q.section===1?op:`${i+1}．${op}`);b.onclick=()=>answer(i+1,b);choices.appendChild(b)});
 $("result").className="result hidden";$("result").textContent="";$("next").disabled=true;
 renderNav();
}
function answer(v,btn){if(answered)return;answered=true;const q=quiz[idx];const ok=String(v)===String(q.answer);if(ok)score++;document.querySelectorAll(".choice").forEach((b,i)=>{if(String(i+1)===String(q.answer))b.classList.add("correct")});if(!ok)btn.classList.add("wrong");const r=$("result");r.className="result "+(ok?"ok":"ng");r.textContent=(ok?"正解！":"不正解。")+`\n正答：${q.section===1?(q.answer==="1"?"○":"×"):q.answer+"．"+(q.options[Number(q.answer)-1]||"")}\n\n解説：${q.explanation||"（解説なし）"}`;$("next").disabled=false;renderNav()}
function next(){if(!answered)return;if(idx<quiz.length-1){idx++;render();window.scrollTo({top:0,behavior:"smooth"})}else finish()}
function renderNav(){const n=$("nav");n.innerHTML="";quiz.forEach((q,i)=>{const b=document.createElement("button");b.textContent=i+1;b.className=(i===idx?"cur ":"")+(i<idx?"done":"");b.onclick=()=>{if(i<=idx || answered){idx=i;render();window.scrollTo({top:0,behavior:"smooth"})}};n.appendChild(b)})}
function finish(){$("quiz").classList.add("hidden");$("finish").classList.remove("hidden");$("score").textContent=`${score} / ${quiz.length}`;$("summary").textContent=`正答率 ${Math.round(score/quiz.length*100)}％`;window.scrollTo({top:0,behavior:"smooth"})}
function home(){$("finish").classList.add("hidden");$("quiz").classList.add("hidden");$("setup").classList.remove("hidden");window.scrollTo({top:0,behavior:"smooth"})}
function retry(){if(!lastConfig)return;$("date").value=lastConfig.date;$("section").value=lastConfig.sec;$("count").value=lastConfig.count;$("order").value=lastConfig.order;startQuiz()}
$("start").addEventListener("click",startQuiz);$("next").addEventListener("click",next);$("quit").addEventListener("click",home);$("home").addEventListener("click",home);$("retry").addEventListener("click",retry);
fillDates();
</script></body></html>
